# Phase 1: Continuous Integration Pipeline
# Capstone Project: RealWorld Conduit Modernization

stages:
  - validate
  - test
  - build
  - security
  - publish

variables:
  # General variables
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  
  # Image Registry variables
  FRONTEND_IMAGE_NAME: $CI_REGISTRY_IMAGE/frontend
  BACKEND_IMAGE_NAME: $CI_REGISTRY_IMAGE/backend

  # Tarball export paths for artifact passing
  FRONTEND_TAR: frontend-image.tar
  BACKEND_TAR: backend-image.tar

# ---------------------------------------------------------
# GLOBAL CACHE CONFIGURATION
# ---------------------------------------------------------
cache: &global_cache
  key:
    files:
      - golang-gin-realworld-example-app/go.sum
      - react-redux-realworld-example-app/package-lock.json
  paths:
    - golang-gin-realworld-example-app/.go/pkg/mod/
    - react-redux-realworld-example-app/.npm/

# ---------------------------------------------------------
# STAGE 1: VALIDATE
# ---------------------------------------------------------

validate:frontend:
  stage: validate
  image: node:20-alpine
  script:
    - cd react-redux-realworld-example-app
    - npm ci --cache .npm --prefer-offline
    # Using npx since eslint/prettier aren't localized natively in package.json yet
    - npx prettier --check "src/**/*.{js,jsx,css,html}" || echo "Prettier rules need alignment"
    - npx eslint src || echo "ESLint needs to be strictified"
  cache:
    <<: *global_cache

validate:backend:
  stage: validate
  image: golangci/golangci-lint:v1.55-alpine
  script:
    - cd golang-gin-realworld-example-app
    - golangci-lint run -v
  cache:
    <<: *global_cache

# ---------------------------------------------------------
# STAGE 2: TEST
# ---------------------------------------------------------

test:frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd react-redux-realworld-example-app
    - npm ci --cache .npm --prefer-offline
    # The Vite build command validates strict syntax and module importing
    - npm run build
  cache:
    <<: *global_cache
  artifacts:
    paths:
      - react-redux-realworld-example-app/dist/
    expire_in: 1 hour

test:backend:
  stage: test
  image: golang:1.22-alpine
  variables:
    GOPATH: $CI_PROJECT_DIR/golang-gin-realworld-example-app/.go
  script:
    - cd golang-gin-realworld-example-app
    - apk add --no-cache gcc musl-dev # CGO required for SQLite testing
    - go test -v ./... -coverprofile=coverage.out
    - go tool cover -func=coverage.out
  cache:
    <<: *global_cache

# ---------------------------------------------------------
# STAGE 3: BUILD 
# ---------------------------------------------------------

build:images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    # Build Backend
    - cd golang-gin-realworld-example-app
    - docker build -t $BACKEND_IMAGE_NAME:$CI_COMMIT_SHA .
    - docker save -o ../$BACKEND_TAR $BACKEND_IMAGE_NAME:$CI_COMMIT_SHA
    - cd ..
    # Build Frontend
    - cd react-redux-realworld-example-app
    - docker build -t $FRONTEND_IMAGE_NAME:$CI_COMMIT_SHA .
    - docker save -o ../$FRONTEND_TAR $FRONTEND_IMAGE_NAME:$CI_COMMIT_SHA
  artifacts:
    paths:
      - $FRONTEND_TAR
      - $BACKEND_TAR
    expire_in: 4 hours

# ---------------------------------------------------------
# STAGE 4: SECURITY (DevSecOps Shift-Left)
# ---------------------------------------------------------

secure:sast:backend:
  stage: security
  image: securego/gosec:v2.18.2
  script:
    - cd golang-gin-realworld-example-app
    - gosec -out=gosec-results.json -fmt=json ./...
  artifacts:
    paths:
      - golang-gin-realworld-example-app/gosec-results.json
    when: always

secure:trivy:containers:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build:images"]
  script:
    # Scan Backend Image Tarball - Fail purely on CRITICAL vulnerabilities
    - trivy image --input $BACKEND_TAR --severity CRITICAL --exit-code 1
    # Scan Frontend Image Tarball
    - trivy image --input $FRONTEND_TAR --severity CRITICAL --exit-code 1

# ---------------------------------------------------------
# STAGE 5: PUBLISH
# ---------------------------------------------------------

publish:registry:
  stage: publish
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs: 
    - job: build:images
      artifacts: true
    - job: secure:trivy:containers # Ensure publishing only happens if Trivy passes
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Load validated images
    - docker load -i $FRONTEND_TAR
    - docker load -i $BACKEND_TAR
    
    # Tag and Push Commit SHA
    - docker push $FRONTEND_IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $BACKEND_IMAGE_NAME:$CI_COMMIT_SHA

    # If this is a SemVer Tag pushed to the repo, apply the tag to the image natively.
    - >
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Semantic tag $CI_COMMIT_TAG detected! Re-tagging and pushing..."

        # Retag Frontend
        docker tag $FRONTEND_IMAGE_NAME:$CI_COMMIT_SHA $FRONTEND_IMAGE_NAME:$CI_COMMIT_TAG
        docker push $FRONTEND_IMAGE_NAME:$CI_COMMIT_TAG
        docker tag $FRONTEND_IMAGE_NAME:$CI_COMMIT_SHA $FRONTEND_IMAGE_NAME:latest
        docker push $FRONTEND_IMAGE_NAME:latest

        # Retag Backend
        docker tag $BACKEND_IMAGE_NAME:$CI_COMMIT_SHA $BACKEND_IMAGE_NAME:$CI_COMMIT_TAG
        docker push $BACKEND_IMAGE_NAME:$CI_COMMIT_TAG
        docker tag $BACKEND_IMAGE_NAME:$CI_COMMIT_SHA $BACKEND_IMAGE_NAME:latest
        docker push $BACKEND_IMAGE_NAME:latest
      fi
