apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: campus-market-dev
  labels:
    app: frontend
    tier: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: ui
    spec:
      containers:
        - name: frontend
          image: final-lab-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4100
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
