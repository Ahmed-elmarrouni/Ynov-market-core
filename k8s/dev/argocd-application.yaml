apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: conduit-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/your-username/final-lab.git' # Replace with actual Git repository HTTPS URL
    targetRevision: main
    path: k8s/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: campus-market-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
