version: "3.8"

services:
  backend:
    build: ./BE
    ports:
      - "8085:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
    volumes:
      - ./BE/data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build: ./FE
    ports:
      - "4100:4100"
    environment:
      - VITE_BACKEND_URL=http://localhost:8085/api
    depends_on:
      - backend
